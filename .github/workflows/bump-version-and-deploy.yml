# Runs the smoke suite on every push to main and on every pull request,
# then — only if it passed — bumps the app version so deployed browsers
# pick the new build up (js/core/version.js, version.json, the sw.js
# cache name and CHANGELOG.md move together; see scripts/bump-version.js).
#
# The version bump is what pushes an update out to everyone who has the
# app open, so gating it on the tests means a broken build never gets
# handed to the shop automatically.
#
# The bump is committed back to main with [skip ci] so it does not
# retrigger this workflow.
name: Test, bump version and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  test:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Install the browser the suite drives
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Run the smoke suite
        run: npm test

  bump:
    name: Bump version
    needs: test
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # CHANGELOG.md is written for the person running the shop, in Arabic.
      # A commit can supply its entry with a line starting "سجل:"; without
      # one the English commit subject is used, which is better than
      # nothing but worth avoiding for anything user-visible.
      - name: Bump patch version
        id: bump
        run: |
          NOTE=$(git log -1 --pretty=%B | grep -m1 '^سجل:' | sed 's/^سجل:[[:space:]]*//' || true)
          if [ -z "$NOTE" ]; then
            NOTE=$(git log -1 --pretty=%s | sed 's/\[skip ci\]//g' | xargs)
          fi
          echo "version=$(node scripts/bump-version.js patch "$NOTE")" >> "$GITHUB_OUTPUT"

      - name: Commit the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/version.js version.json sw.js CHANGELOG.md
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push
